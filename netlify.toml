[build]
  publish = "."
  functions = "api"

[functions]
  node_bundle = true
  timeout = 25

# API route → evaluation function
[[redirects]]
  from = "/api/eval"
  to = "/.netlify/functions/eval"
  status = 200

# SPA fallback — must come last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
