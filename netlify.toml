[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
  # Include evaluator.py and data files in the function bundle
  included_files = ["evaluator.py", "data/**", "case-studies/**"]

# API route → Netlify Function
[[redirects]]
  from = "/api/eval"
  to = "/.netlify/functions/eval"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
